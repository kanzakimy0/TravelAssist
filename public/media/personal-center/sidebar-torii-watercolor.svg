<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6E9E3"/>
      <stop offset="55%" stop-color="#F2E5DE"/>
      <stop offset="100%" stop-color="#E8E1D6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8CBD0"/>
      <stop offset="100%" stop-color="#8FAFB7"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8AAA5"/>
      <stop offset="100%" stop-color="#858D88"/>
    </linearGradient>
    <linearGradient id="torii" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C96F5C"/>
      <stop offset="100%" stop-color="#A94D43"/>
    </linearGradient>
    <pattern id="waves" width="72" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 18 Q18 0 36 18 Q54 36 72 18" fill="none" stroke="#6F97A0" stroke-width="2" opacity=".18"/>
    </pattern>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="soft">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>
  <g filter="url(#paper)">
    <rect width="1200" height="800" fill="url(#sky)"/>
    <ellipse cx="230" cy="180" rx="260" ry="95" fill="#E8C7C0" opacity=".18" filter="url(#soft)"/>
    <ellipse cx="880" cy="150" rx="300" ry="110" fill="#F2D5C8" opacity=".16" filter="url(#soft)"/>
    <path d="M0 420 C180 365 290 385 405 318 C520 250 615 330 720 290 C840 245 930 330 1200 305 L1200 535 L0 535 Z" fill="url(#mountain)" opacity=".56"/>
    <path d="M0 456 C195 402 325 430 455 372 C605 305 730 405 845 350 C970 295 1080 390 1200 365 L1200 540 L0 540 Z" fill="#697A75" opacity=".32"/>
    <rect y="500" width="1200" height="300" fill="url(#water)"/>
    <rect y="515" width="1200" height="285" fill="url(#waves)"/>
    <path d="M0 553 C160 530 290 540 420 525 C600 505 745 540 930 518 C1040 506 1120 505 1200 515 L1200 585 L0 585 Z" fill="#D8D2C6" opacity=".34"/>
    <g transform="translate(130 280)">
      <rect x="0" y="0" width="700" height="34" rx="8" fill="#3A3532"/>
      <rect x="30" y="34" width="640" height="30" rx="5" fill="url(#torii)"/>
      <rect x="92" y="64" width="54" height="320" rx="8" fill="url(#torii)"/>
      <rect x="548" y="64" width="54" height="320" rx="8" fill="url(#torii)"/>
      <rect x="46" y="115" width="602" height="28" rx="4" fill="url(#torii)"/>
      <rect x="86" y="374" width="66" height="20" rx="4" fill="#403733" opacity=".85"/>
      <rect x="542" y="374" width="66" height="20" rx="4" fill="#403733" opacity=".85"/>
    </g>
    <path d="M0 120 C115 125 170 90 265 38" fill="none" stroke="#6F5147" stroke-width="12" stroke-linecap="round" opacity=".75"/>
    <path d="M72 120 C130 95 170 80 215 56" fill="none" stroke="#6F5147" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    <g opacity=".82">
      <g transform="translate(90 104)"><circle cx="0" cy="-12" r="10" fill="#E8A6AA"/><circle cx="11" cy="-4" r="10" fill="#F0B8BB"/><circle cx="7" cy="9" r="10" fill="#E9A4AA"/><circle cx="-7" cy="9" r="10" fill="#F1B9BC"/><circle cx="-11" cy="-4" r="10" fill="#E6A0A6"/><circle cx="0" cy="0" r="4" fill="#D89486"/></g>
      <g transform="translate(150 82) scale(.8)"><circle cx="0" cy="-12" r="10" fill="#E8A6AA"/><circle cx="11" cy="-4" r="10" fill="#F0B8BB"/><circle cx="7" cy="9" r="10" fill="#E9A4AA"/><circle cx="-7" cy="9" r="10" fill="#F1B9BC"/><circle cx="-11" cy="-4" r="10" fill="#E6A0A6"/><circle cx="0" cy="0" r="4" fill="#D89486"/></g>
      <g transform="translate(210 58) scale(.65)"><circle cx="0" cy="-12" r="10" fill="#E8A6AA"/><circle cx="11" cy="-4" r="10" fill="#F0B8BB"/><circle cx="7" cy="9" r="10" fill="#E9A4AA"/><circle cx="-7" cy="9" r="10" fill="#F1B9BC"/><circle cx="-11" cy="-4" r="10" fill="#E6A0A6"/><circle cx="0" cy="0" r="4" fill="#D89486"/></g>
    </g>
    <g fill="#E8A2AA" opacity=".55">
      <ellipse cx="970" cy="215" rx="9" ry="4" transform="rotate(24 970 215)"/>
      <ellipse cx="1040" cy="260" rx="7" ry="3" transform="rotate(-22 1040 260)"/>
      <ellipse cx="900" cy="330" rx="8" ry="3.5" transform="rotate(38 900 330)"/>
      <ellipse cx="1080" cy="390" rx="7" ry="3" transform="rotate(12 1080 390)"/>
      <ellipse cx="990" cy="455" rx="8" ry="3" transform="rotate(-28 990 455)"/>
    </g>
    <path d="M110 640 C300 625 430 646 610 632 C770 620 900 646 1100 630" fill="none" stroke="#E6EEEE" stroke-width="4" opacity=".3"/>
    <path d="M50 705 C220 690 390 716 540 700 C760 680 900 718 1160 694" fill="none" stroke="#E9F0EF" stroke-width="3" opacity=".24"/>
  </g>
</svg>
