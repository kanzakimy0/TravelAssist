<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Default traveler avatar</title>
  <desc id="desc">Neutral abstract person silhouette, not a photograph or an actual user's identity. Warm ivory, peach and muted clay.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCF7F0"/>
      <stop offset="1" stop-color="#F1DED3"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#B28B79"/>
      <stop offset="1" stop-color="#946F61"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="128" cy="128" r="119"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="123" fill="url(#paper)" stroke="#E4CBBE" stroke-width="2"/>
