name: poi-second-layer-feature-v3.9

on:
  push:
    branches:
      - poi-source-enrichment-v3-8
    paths:
      - '.tmp/poi_second_layer_feature_v39.py'
      - '.github/workflows/poi-second-layer-feature-v3.9.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check requests rapidfuzz shapely
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
      - name: Download v3.8.2 source-enriched input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download 34554265640 --repo kanzakimy0/TravelAssist --name travelassist-poi-source-enrichment-v3.8.2-mlit2026 --dir input
          test -f input/remaining5021-source-enriched-v3.8.2.jsonl
          test "$(wc -l < input/remaining5021-source-enriched-v3.8.2.jsonl)" -eq 5021
      - name: Download current OSM regional extracts
        run: |
          mkdir -p osm/raw osm/filtered
          for r in chubu chugoku kansai kyushu shikoku; do
            wget -q --show-progress "https://download.geofabrik.de/asia/japan/${r}-latest.osm.pbf" -O "osm/raw/${r}.osm.pbf"
            test -s "osm/raw/${r}.osm.pbf"
          done
      - name: Filter modern heritage/religious POI candidates
        run: |
          for f in osm/raw/*.osm.pbf; do
            b=$(basename "$f" .osm.pbf)
            osmium tags-filter "$f" \
              nwr/historic \
              nwr/heritage \
              nwr/amenity=place_of_worship \
              nwr/tourism=attraction \
              nwr/tourism=museum \
              nwr/ruins=yes \
              nwr/man_made=works \
              nwr/man_made=kiln \
              -o "osm/filtered/${b}.osm.pbf" --overwrite
          done
          osmium merge osm/filtered/*.osm.pbf -o osm/relevant.osm.pbf --overwrite
          osmium export osm/relevant.osm.pbf -f geojsonseq -o osm/relevant.geojsonseq --overwrite
          test -s osm/relevant.geojsonseq
      - name: Run second-layer matching and Feature43 enrichment
        run: python .tmp/poi_second_layer_feature_v39.py input/remaining5021-source-enriched-v3.8.2.jsonl osm/relevant.geojsonseq build/poi-v3.9
      - name: Validate outputs
        run: |
          test "$(wc -l < build/poi-v3.9/remaining5021-source-enriched-v3.9.jsonl)" -eq 5021
          test "$(wc -l < build/poi-v3.9/feature43-remaining5021-v3.9.jsonl)" -eq 5021
          python -m json.tool build/poi-v3.9/coverage-report-v3.9.json >/dev/null
          python -m json.tool build/poi-v3.9/feature-distribution-v3.9.json >/dev/null
          cat build/poi-v3.9/coverage-report-v3.9.json
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: travelassist-poi-second-layer-feature-v3.9
          path: build/poi-v3.9/
          if-no-files-found: error
          retention-days: 7
