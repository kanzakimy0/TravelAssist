name: Quality gate

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate local deployment contract
        run: npm run deploy:validate:local

      - name: Run repository tests
        run: node --import ./tests/register-route-ts.mjs --test "tests/*.test.mjs"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check:deploy

      - name: Build and audit standalone artifact
        run: npm run deploy:build:local

      - name: Verify artifact again before use
        run: npm run deploy:verify-artifact

      - name: Check whitespace
        run: git diff --check
