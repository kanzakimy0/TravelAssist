name: Quality gate

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      task086FinalCloseout:
        description: Verify the frozen TASK-086 published artifacts and retain rebuild proof
        type: boolean
        default: false
      expectedHead:
        description: Optional exact branch SHA expected for publication recovery
        type: string
        default: ""
      validationTimeoutMinutes:
        description: Bounded budget for the expanded frozen-data regression
        type: choice
        options: ["35", "90"]
        default: "35"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !(inputs.task086FinalCloseout || github.head_ref == 'feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/develop') }}
    name: Install, test and build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.validationTimeoutMinutes || '35') }}
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Record branch HEAD and actual checkout revision
        run: node tools/qa/ci-revision.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Validate local deployment contract
        run: npm run deploy:validate:local

      - name: Run repository tests
        env:
          TASK086_VERIFY_PUBLISHED: ${{ inputs.task086FinalCloseout && '1' || '0' }}
          TASK086_REBUILD_RECEIPT: ${{ inputs.task086FinalCloseout && format('{0}/task086-deterministic-rebuild.json', runner.temp) || '' }}
        run: node --import ./tests/register-route-ts.mjs --test "tests/*.test.mjs"

      - name: Retain final-closeout revision and deterministic proof
        if: always() && inputs.task086FinalCloseout
        uses: actions/upload-artifact@v4
        with:
          name: task086-final-closeout-${{ github.sha }}
          path: |
            .artifacts/ci/revision.json
            ${{ runner.temp }}/task086-deterministic-rebuild.json
          if-no-files-found: error
          include-hidden-files: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check:deploy

      - name: Build and audit standalone artifact
        run: npm run deploy:build:local

      - name: Verify artifact again before use
        run: npm run deploy:verify-artifact

      - name: Check whitespace
        run: git diff --check

  regression:
    name: Full Node regression / ${{ matrix.lane }}
    if: ${{ inputs.task086FinalCloseout || github.head_ref == 'feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        lane: [assets, regression-0, regression-1, regression-2, regression-3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify and record actual event checkout
        env:
          EXPECTED_HEAD: ${{ inputs.expectedHead }}
        run: |
          test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node tools/qa/ci-revision.mjs
      - run: npm ci
      - run: node tools/qa/task-086-regression-lanes.mjs ${{ matrix.lane }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task086-regression-${{ matrix.lane }}-${{ github.sha }}
          path: |
            .artifacts/ci/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  graph:
    name: Clean graph / ${{ matrix.lane }}
    if: ${{ inputs.task086FinalCloseout || github.head_ref == 'feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [first, second]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify and record actual event checkout
        env:
          EXPECTED_HEAD: ${{ inputs.expectedHead }}
        run: |
          test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node tools/qa/ci-revision.mjs
      - run: npm ci
      - run: timeout --signal=TERM --kill-after=30s 2400s node tools/transport/task-086-validation.mjs ${{ matrix.lane }} .artifacts/task086-lanes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task086-graph-${{ matrix.lane }}-${{ github.sha }}
          path: |
            .artifacts/ci/revision.json
            .artifacts/task086-lanes/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  extraction:
    name: Retained raw source reproduction
    if: ${{ inputs.task086FinalCloseout || github.head_ref == 'feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify and record actual event checkout
        env:
          EXPECTED_HEAD: ${{ inputs.expectedHead }}
        run: |
          test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node tools/qa/ci-revision.mjs
      - run: npm ci
      - run: timeout --signal=TERM --kill-after=30s 1200s node tools/transport/task-086-validation.mjs extract .artifacts/task086-lanes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task086-extraction-${{ github.sha }}
          path: |
            .artifacts/ci/revision.json
            .artifacts/task086-lanes/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  resume:
    name: Stable complete graph resume
    needs: graph
    if: ${{ inputs.task086FinalCloseout || github.head_ref == 'feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify and record actual event checkout
        env:
          EXPECTED_HEAD: ${{ inputs.expectedHead }}
        run: |
          test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node tools/qa/ci-revision.mjs
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: task086-graph-first-${{ github.sha }}
          path: .artifacts
      - run: timeout --signal=TERM --kill-after=30s 2400s node tools/transport/task-086-validation.mjs resume .artifacts/task086-lanes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task086-resume-${{ github.sha }}
          path: |
            .artifacts/ci/revision.json
            .artifacts/task086-lanes/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  proof:
    name: Deterministic, recovery and published-artifact proof
    needs: [graph, extraction, resume]
    if: ${{ inputs.task086FinalCloseout || github.head_ref == 'feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify and record actual event checkout
        env:
          EXPECTED_HEAD: ${{ inputs.expectedHead }}
        run: |
          test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node tools/qa/ci-revision.mjs
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: task086-graph-*-${{ github.sha }}
          merge-multiple: true
          path: .artifacts
      - uses: actions/download-artifact@v4
        with:
          name: task086-resume-${{ github.sha }}
          path: .artifacts
      - uses: actions/download-artifact@v4
        with:
          name: task086-extraction-${{ github.sha }}
          path: .artifacts
      - name: Execute original rebuild regression with complete exact-head lane receipts
        env:
          TASK086_VERIFIED_LANES_DIR: ${{ github.workspace }}/.artifacts/task086-lanes
          TASK086_VERIFY_PUBLISHED: "1"
          TASK086_REBUILD_RECEIPT: ${{ github.workspace }}/.artifacts/task086-lanes/deterministic-recovery-proof.json
        run: node tools/qa/task-086-regression-lanes.mjs rebuild
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task086-proof-${{ github.sha }}
          path: |
            .artifacts/ci/
            .artifacts/task086-lanes/*.receipt.json
            .artifacts/task086-lanes/deterministic-recovery-proof.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  quality:
    name: Lint, types, formatting and build
    if: ${{ inputs.task086FinalCloseout || github.head_ref == 'feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify and record actual event checkout
        env:
          EXPECTED_HEAD: ${{ inputs.expectedHead }}
        run: |
          test -z "$EXPECTED_HEAD" || test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          node tools/qa/ci-revision.mjs
      - run: npm ci
      - run: npm run deploy:validate:local
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check:deploy
      - run: npm run deploy:build:local
      - run: npm run deploy:verify-artifact
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task086-quality-${{ github.sha }}
          path: |
            .artifacts/ci/revision.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  closeout-quality-gate:
    name: TASK086 exact-head Quality Gate
    needs: [regression, graph, extraction, resume, proof, quality]
    if: ${{ always() && (inputs.task086FinalCloseout || github.head_ref == 'feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/feature/b-transport-node-mobility-backbone' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.proof.result == 'success' }}
        with:
          name: task086-proof-${{ github.sha }}
          path: .artifacts
      - uses: actions/download-artifact@v4
        if: ${{ needs.regression.result == 'success' }}
        with:
          pattern: task086-regression-*-${{ github.sha }}
          merge-multiple: true
          path: .artifacts
      - name: Fail closed unless every required lane completed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED_HEAD: ${{ inputs.expectedHead }}
        run: |
          python3 - <<'PY'
          import json,os
          needs=json.loads(os.environ['RESULTS'])
          assert all(v['result']=='success' for v in needs.values()),needs
          expected=os.environ.get('EXPECTED_HEAD')
          assert not expected or expected==os.environ['GITHUB_SHA']
          from pathlib import Path
          import hashlib
          proof=json.loads(Path('.artifacts/task086-lanes/deterministic-recovery-proof.json').read_text())
          binding=proof['binding']
          assert proof['status']=='PASS'
          assert binding['checkoutSha']==os.environ['GITHUB_SHA']
          assert binding['runId']==os.environ['GITHUB_RUN_ID']
          assert binding['runAttempt']==os.environ['GITHUB_RUN_ATTEMPT']
          checks=['fullDeterministicRebuild','resumeChecksumSkip','exceptionProofInputPreserved','publishedArtifactComparison','resumeCorruptionInvalidation']
          assert all(proof.get(k)=='PASS' for k in checks)
          inventory=json.loads(Path('.artifacts/ci/regression-inventory.json').read_text())
          assert sorted(sum(inventory['lanes'].values(),[]))==inventory['files']
          assert len(set(inventory['files']))==inventory['fileCount']
          receipt={'status':'PASS_CLOSEOUT_PUBLICATION_RECOVERY','expectedBranchHead':expected or os.environ['GITHUB_SHA'],'actualCheckoutSha':binding['checkoutSha'],'checkoutEquality':True,'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'event':os.environ['GITHUB_EVENT_NAME'],'branch':os.environ['GITHUB_REF_NAME'],'qualityGateUrl':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'inputCodeSha256':binding['inputCodeSha256'],'proofInputSha256':binding['proofInputSha256'],'fullRegressionFiles':inventory['fileCount'],'requiredLaneResults':needs,'deterministicRecoveryChecks':{k:proof[k] for k in checks},'publishedArtifactCount':len(proof['coreArtifactHashes']),'batchCount':proof['batchCount'],'certificationBlockersUnchanged':251,'executionBlockers':0,'wbs':'B / 阻塞'}
          receipt['binding']=binding
          receipt['coreArtifactHashes']=proof['coreArtifactHashes']
          receipt['deterministicRecoveryProofSha256']=hashlib.sha256(Path('.artifacts/task086-lanes/deterministic-recovery-proof.json').read_bytes()).hexdigest()
          receipt['regressionInventory']=inventory
          eligibility=json.loads(Path('.artifacts/ci/routing-eligibility-receipt.json').read_text())
          assert eligibility['status']=='PASS'
          assert eligibility['checkoutSha']==os.environ['GITHUB_SHA']
          assert eligibility['runId']==os.environ['GITHUB_RUN_ID']
          assert eligibility['runAttempt']==os.environ['GITHUB_RUN_ATTEMPT']
          assert eligibility['terminalRoots']==251 and eligibility['pendingRoots']==0
          assert eligibility['failClosedBoundary']=='PASS'
          receipt['status']='COMPLETE_WITH_READMITTABLE_UNVERIFIED_EXCLUSIONS'
          receipt['historicalCertificationRoots']=receipt.pop('certificationBlockersUnchanged')
          receipt['pendingCertificationRoots']=0
          receipt['wbs']='B / 待审查（exact-head technical gate PASS; authorized normal merge pending）'
          receipt['eligibility']=eligibility
          receipt['eligibilityReceiptSha256']=hashlib.sha256(Path('.artifacts/ci/routing-eligibility-receipt.json').read_bytes()).hexdigest()
          output=Path('.artifacts/ci/closeout-publication-final-receipt.json')
          output.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:receipt[k] for k in ['status','actualCheckoutSha','fullRegressionFiles','batchCount','executionBlockers','qualityGateUrl']}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: task086-final-exact-head-${{ github.sha }}
          path: .artifacts/ci/closeout-publication-final-receipt.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
