name: Temporary WBS 5.16 start sync

on:
  push:
    branches:
      - docs/wbs-5-16-start

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/wbs-5-16-start
          fetch-depth: 0
      - name: Update exactly WBS 5.16 and remove workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/project/WBS-TravelAssist.md')
          text = p.read_text(encoding='utf-8')
          old = '| 5.16   | Preference 持久化 API                | B      | P0     | 5.11,8.1  | 未开始 |'
          new = '| 5.16   | Preference 持久化 API                | B      | P0     | 5.11,8.1  | 进行中 |'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one WBS 5.16 row, found {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/tmp-wbs-516-start.yml').unlink()
      - name: Commit exact status change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project/WBS-TravelAssist.md .github/workflows/tmp-wbs-516-start.yml
          git diff --cached --check
          git commit -m "docs(wbs): mark 5.16 in progress"
          git push origin HEAD:docs/wbs-5-16-start
