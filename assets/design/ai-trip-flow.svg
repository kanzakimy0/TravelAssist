    <rect x="690" y="190" width="220" height="110" rx="26" fill="#edf0f8"/><text x="724" y="230" font-size="16" fill="#66718c">结构化 Patch</text><text x="720" y="266" font-size="20" font-weight="700" fill="#46516e">Trip + Preference</text>
