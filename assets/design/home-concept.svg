<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2ec"/>
      <stop offset="0.55" stop-color="#e9eef8"/>
      <stop offset="1" stop-color="#efe8f5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#27324a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- abstract travel / Japan-inspired background -->
  <circle cx="1280" cy="150" r="76" fill="#e99583" opacity="0.58"/>
  <path d="M0 650 C220 530 340 670 560 560 S930 510 1130 600 S1420 530 1600 600 V900 H0Z" fill="#dfe5ef"/>
  <path d="M0 710 C240 600 420 735 650 640 S1020 610 1230 690 S1470 620 1600 650" fill="none" stroke="#7f8eb1" stroke-width="7" opacity="0.34"/>
  <path d="M250 760 C430 600 535 535 680 430 C835 315 985 290 1150 340" fill="none" stroke="#b86f83" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <circle cx="420" cy="620" r="11" fill="#b86f83"/><circle cx="675" cy="435" r="11" fill="#b86f83"/><circle cx="1010" cy="310" r="11" fill="#b86f83"/>

  <!-- compact nav -->
  <g filter="url(#shadow)">
    <rect x="56" y="42" width="1488" height="70" rx="28" fill="#ffffff" fill-opacity="0.74" stroke="#ffffff"/>
  </g>
  <text x="94" y="87" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#29324a">TravelAssist</text>
  <text x="1378" y="85" font-family="Arial, sans-serif" font-size="18" fill="#4d566a">登录</text>
  <circle cx="1492" cy="77" r="18" fill="#5e6589"/>

  <!-- hero -->
  <g filter="url(#shadow)">
    <rect x="150" y="240" width="650" height="354" rx="48" fill="#ffffff" fill-opacity="0.72" stroke="#ffffff"/>
  </g>
  <text x="202" y="335" font-family="Arial, sans-serif" font-size="25" fill="#6d7180">AI TRAVEL PLANNER</text>
  <text x="202" y="405" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#252d43">下一段旅程，</text>
  <text x="202" y="472" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#252d43">从这里开始。</text>
  <text x="202" y="523" font-family="Arial, sans-serif" font-size="20" fill="#6f7585">少一点表单，多一点真实的旅行想法。</text>
  <rect x="202" y="550" width="252" height="78" rx="39" fill="#535f89"/>
  <text x="258" y="598" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">让我们开始吧</text>

  <!-- AI floating entry -->
  <g filter="url(#shadow)">
    <rect x="1275" y="705" width="248" height="118" rx="38" fill="#ffffff" fill-opacity="0.86"/>
  </g>
  <circle cx="1335" cy="764" r="33" fill="#d68191"/>
  <path d="M1320 765 Q1335 745 1350 765 Q1335 786 1320 765Z" fill="#fff"/>
  <text x="1388" y="753" font-family="Arial, sans-serif" font-size="17" fill="#757b89">AI 助手</text>
  <text x="1388" y="781" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#31394c">直接告诉我想去哪</text>

  <text x="64" y="862" font-family="Arial, sans-serif" font-size="16" fill="#747b8b">Concept only · 16:9 · compact nav · dynamic travel background · rounded floating UI · no green primary</text>
</svg>