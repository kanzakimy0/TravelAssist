  <text x="92" y="820" font-family="Arial" font-size="14" fill="#777e8c">硬限制与软偏好的最终 UI 区分尚待冻结；发生冲突时必须提示并解释取舍。</text>
  <text x="60" y="884" font-family="Arial" font-size="14" fill="#777e8c">Concept only · companions first · medium-level quick controls · small-level detailed restrictions</text>
